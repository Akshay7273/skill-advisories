name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example v0.4.0)"
        required: true
        type: string

# Read-only by default so a job added here later has to ask for write rather
# than inherit it. The publish job asks below, and is the only job that does.
permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Akshay7273/skill-advisories'
    runs-on: ubuntu-latest
    # contents: write creates the release and moves the v1 pointer tag;
    # id-token and attestations write the provenance attached to the npm
    # package and the feed checksum manifest.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic-version release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify package version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const expected=process.env.RELEASE_TAG.slice(1);const actual=require("./package.json").version;if(actual!==expected)throw new Error(`tag ${expected} does not match package ${actual}`)'
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Verify generated feeds are committed
        run: |
          npm run compile
          git diff --exit-code feed/
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          path=$(npm pack --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Attest npm package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.path }}
      - name: Attest feed checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: feed/checksums.txt
      - name: Publish to npm with provenance
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then dist_tag=next; fi
          npm publish "${{ steps.pack.outputs.path }}" --access public --provenance --tag "$dist_tag"
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          args=(--verify-tag --generate-notes --title "skill-advisories $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
      - name: Move the action pointer tag to this release
        if: ${{ !contains(inputs.tag, '-') }}
        shell: bash
        env:
          POINTER_TAG: v1
        run: |
          # Consumers write `uses: Akshay7273/skill-advisories@v1`, so the
          # pointer has to be moved or they stay on whatever release last
          # moved it. It drifted three releases behind before this step
          # existed.
          #
          # The pointer is deliberately not derived from the release tag. It
          # names the action's input contract in action.yml, which has been
          # stable since v1 and is versioned separately from the package --
          # deriving it while the package sits at 0.x would compute "v0" and
          # leave the tag consumers actually reference untouched.
          #
          # HEAD is the release commit: the checkout above pinned this job to
          # the release tag, and it is used rather than resolving the tag again
          # because that checkout is shallow.
          git tag -f "$POINTER_TAG" HEAD
          git push --force origin "refs/tags/$POINTER_TAG"
