name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run health:check
      - run: npm run ops:check
      - run: npm run integrations:check
      - name: Shipped integrations match their approved contents
        run: npm run lock:check
      - name: Adoption ledger is well formed
        run: npm run adopters:check
      - name: Published feed is a usable recovery point
        run: npm run rollback:check
      - name: Feed is in sync with advisories
        run: |
          npm run compile
          git diff --exit-code feed/
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Clean name passes
        uses: ./
        with:
          names: totally-safe-skill
      - name: Ecosystem filter avoids unrelated matches
        uses: ./
        with:
          names: omnicogg
          ecosystem: npm
      - name: Known-bad name is detected
        id: detect
        continue-on-error: true
        uses: ./
        with:
          names: omnicogg
      - name: Assert detection failed the step
        run: |
          if [ "${{ steps.detect.outcome }}" != "failure" ]; then
            echo "expected the detection step to fail (exit 1), but it did not"
            exit 1
          fi
          echo "detection behaved correctly"
  benchmark-regression:
    name: Synthetic benchmark regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark:ci
