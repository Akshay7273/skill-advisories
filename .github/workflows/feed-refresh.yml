name: Feed freshness publication

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: feed-refresh
  # Only the newest heartbeat matters. This also prevents a queued hosted-runner
  # job from holding every later daily publication behind it indefinitely.
  cancel-in-progress: true

jobs:
  propose:
    name: Propose fresh feed publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PAT is required here: pushes and PRs made with GITHUB_TOKEN do
          # not emit the workflow events that run this repository's required
          # CI and CodeQL checks, leaving auto-merge permanently blocked.
          token: ${{ secrets.FEED_REFRESH_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh publication timestamp and derived evidence
        run: npm run compile:refresh
      - name: Verify refreshed feed
        run: |
          npm test
          npm run build
          node dist/cli.js verify feed --strict
      - name: Propose and merge after required workflows pass
        env:
          GH_TOKEN: ${{ secrets.FEED_REFRESH_TOKEN }}
        run: |
          branch="automation/feed-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add feed/
          git commit -m "chore(feed): refresh verified publication"
          git push --force origin "$branch"

          pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(feed): refresh verified publication" \
              --body "Automated freshness publication. The advisory set may be unchanged; the generated timestamp, cursor, delta, checksums, and append-only history are refreshed together and verified before this PR is proposed."
            pr="$(gh pr view "$branch" --json number --jq .number)"
          fi
          # workflow_dispatch runs are not counted as PR-required contexts, so
          # enforce the same gate directly: launch both protected workflows on
          # this exact head, wait for each entire run to succeed, then use the
          # maintainer token's admin merge permission. Any failed job stops the
          # step before merge.
          ci_url="$(gh workflow run ci.yml --ref "$branch")"
          codeql_url="$(gh workflow run codeql.yml --ref "$branch")"
          gh run watch "${ci_url##*/}" --interval 10 --exit-status
          gh run watch "${codeql_url##*/}" --interval 10 --exit-status
          gh pr merge "$pr" --admin --squash --delete-branch
